# Sculpt configuration schema. Do not change this value manually.
configVersion: 6

# Core sculpting behavior. These settings support /sculpt admin reload.
sculpt:
  # Default resolution for players without a saved preference: 1, 2, 4, 8, or 16.
  defaultGridSize: 2
  # Fill strategy for players without a saved preference: barrier, shulker,
  # none, or quoted 'null' (an unquoted YAML null means "unset").
  defaultFillMode: shulker
  # Cell renderer for players without a saved preference: head, textdisplay, or auto.
  defaultDisplayMode: auto
  # Server-wide SculptBlock limit. Use -1 for unlimited.
  maxActiveBlocks: -1
  # Allow Sculpt mode to convert a clicked normal block into a SculptBlock.
  convertNormalBlocks: true

# Contextual keyboard shortcuts. These settings support /sculpt admin reload.
controls:
  # Maximum interval for Q×2 display switching and Blueprint Selector F×2.
  # Valid range: 50 to 2000 milliseconds.
  doubleTapWindowMs: 300

# Runtime texture generation. Changes in this section require a server restart.
runtimeBaking:
  mineskin:
    apiKey: ""
    apiUrl: "https://api.mineskin.org"
  upload:
    batchDelayMs: 6000
    timeoutMinutes: 10

storage:
  # Interval for flushing dirty SculptBlock entity data. Supports reload.
  autoSaveIntervalSeconds: 300

rendering:
  textDisplay:
    # Safety limit for TextDisplay entities used by one SculptBlock.
    # Changing this setting requires a restart.
    maxEntitiesPerBlock: 4096

# Limits for native region operations. These settings support /sculpt admin reload.
regionOperations:
  replace:
    # Maximum number of world blocks accepted by one /sculpt replace operation.
    maxVolume: 32768
    # Maximum occupied octree leaves generated by visual-shape replacement.
    # Full outputs remain vanilla blocks and do not consume this budget.
    maxGeneratedLeaves: 131072

language:
  default: "en_us"
  autoDetect: true

blueprint:
  enabled: true
  # Consume a blueprint item after a successful survival-mode paste.
  consumeItemAfterPaste: false
  selection:
    maxVolume: 4096
  storage:
    maxPerPlayer: 100
    maxFolderDepth: 3
  pasteDefaults:
    # Internal migration marker for the automatic rotation convention.
    rotationVersion: 2
    pasteAir: true
    overwriteCells: true
    overwriteBlocks: true
    adhesive: false
    rotateMode: auto
    rotationY: 0
    flip: ""
  web:
    apiEndpoint: "https://sculpt-web.twme.workers.dev/api"
  download:
    allowedDomains:
      - "sculpt-web.twme.workers.dev"
    maxBytes: 12582912

debug:
  textureMarkers: false
