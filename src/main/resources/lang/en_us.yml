# English (US) translations for Sculpt
# Messages use MiniMessage format — see https://docs.advntr.dev/minimessage/format.html
languageVersion: 2

general:
  prefix: "<#478FC6>[Sculpt]</#478FC6>"
  no_permission: "<#CE5F4E>You don't have permission to use this command."
  required_perm: "<#C2C7D3>Required: <white>{0}"
  player_only: "<#CE5F4E>This command must be run by a player."
  reload_success: "<#5FBA6B>Config reloaded (defaultGridSize=<white>{0}<#5FBA6B>)."
  reload_failed: "<#CE5F4E>Config error: <white>{0}"

command:
  sculpt:
    usage: "<#C2C7D3>/sculpt <help|resolution|preview|mode|fill|display|convert|replace|relight|tool|blueprint|heads|admin>"
    unknown_subcommand: "<#CE5F4E>Unknown subcommand: <white>{0}"

    help:
      header: "<#478FC6><bold>Sculpt commands</bold> <dark_gray>— one entry point, grouped by task"
      sculpting_header: "<#7A8B9C>Sculpting"
      resolution: "<click:suggest_command:/sculpt resolution ><#C2C7D3>  /sculpt <white>resolution <dark_gray>— grid density</click>"
      preview: "<click:suggest_command:/sculpt preview ><#C2C7D3>  /sculpt <white>preview <dark_gray>— hover overlay</click>"
      mode: "<click:suggest_command:/sculpt mode ><#C2C7D3>  /sculpt <white>mode <dark_gray>— turn SculptMode on or off</click>"
      fill: "<click:suggest_command:/sculpt fill ><#C2C7D3>  /sculpt <white>fill <dark_gray>— barrier, shulker, or no fill</click>"
      display: "<click:suggest_command:/sculpt display ><#C2C7D3>  /sculpt <white>display <dark_gray>— head, TextDisplay, or automatic rendering</click>"
      convert: "<click:suggest_command:/sculpt convert ><#C2C7D3>  /sculpt <white>convert <dark_gray>— change existing block fill</click>"
      replace: "<click:suggest_command:/sculpt replace ><#C2C7D3>  /sculpt <white>replace <dark_gray>— replace selected block materials</click>"
      relight: "<click:run_command:/sculpt relight><#C2C7D3>  /sculpt <white>relight <dark_gray>— restore automatic TextDisplay lighting</click>"
      content_header: "<#7A8B9C>Tools and content"
      tool: "<click:suggest_command:/sculpt tool ><#C2C7D3>  /sculpt <white>tool <dark_gray>— get a region or blueprint selector</click>"
      blueprint: "<click:suggest_command:/sculpt blueprint ><#C2C7D3>  /sculpt <white>blueprint <dark_gray>— save and share builds</click>"
      heads: "<click:suggest_command:/sculpt heads ><#C2C7D3>  /sculpt <white>heads <dark_gray>— browse baked heads</click>"
      admin: "<click:suggest_command:/sculpt admin ><#C2C7D3>  Administration: <white>admin</click>"
      admin_usage: "<#C2C7D3>/sculpt admin <list|teleport|reload|status>"
      hint: "<#7A8B9C>Use tab completion or <white>/sculpt help<#7A8B9C> to explore commands available to you."

    grid:
      player_only: "<#CE5F4E>/sculpt resolution must be run by a player."
      invalid_grid: "<#CE5F4E>gridN must be one of: 1, 2, 4, 8, 16"
      no_permission_grid: "<#CE5F4E>You don't have permission to use grid size <white>{0}<#CE5F4E>."
      required_perm: "<#C2C7D3>Required: <white>sculpt.command.resolution.{0}"
      look_at_block: "<#C2C7D3>Look at a block to see the grid preview."
      set: "<#C2C7D3>Grid size set to <white>{0}<#C2C7D3>."
      invalid_grid_arg: "<#CE5F4E>Invalid gridN: <white>{0}"
      current: "<#C2C7D3>Current grid size: <white>{0}<#C2C7D3>. Turn on Sculpt mode to edit."



    preview:
      player_only: "<#CE5F4E>/sculpt preview must be run by a player."
      enabled: "<#5FBA6B>Hover preview: <white>ON"
      disabled: "<#E8C96D>Hover preview: <white>OFF"
      usage: "<#CE5F4E>Usage: <#D1968C>/sculpt preview [on|off]"

    replace:
      player_only: "<#CE5F4E>/sculpt replace must be run by a player."
      usage: "<#C2C7D3>Usage: <#D1968C>/sculpt replace <block-data>"
      no_selection: "<#CE5F4E>Select a complete region first with the selection wand."
      invalid_material: "<#CE5F4E>Invalid block material or block data: <white>{0}"
      non_bakeable: "<#CE5F4E>The replacement material cannot be baked: <white>{0}"
      too_large: "<#CE5F4E>The selected volume ({0}) exceeds the replacement limit ({1})."
      not_ready: "<#E8C96D>Sculpt textures are still loading; try again shortly."
      already_running: "<#E8C96D>You already have a region material replacement in progress."
      started: "<#E8C96D>Analyzing up to {1} selected blocks and replacing them with <white>{0}<#E8C96D>..."
      completed: "<#5FBA6B>Material replacement complete: <white>{0}<#5FBA6B> vanilla blocks, <white>{1}<#5FBA6B> existing SculptBlocks, and <white>{2}<#5FBA6B> visual shapes converted to SculptBlocks."
      no_changes: "<#C2C7D3>No non-air blocks in the selection needed replacement."
      protected: "<#CE5F4E>Skipped {0} block(s) in protected areas."
      no_collision: "<#E8C96D>Skipped {0} source block(s) without collision."
      unsupported_source: "<#E8C96D>Skipped {0} source block(s) whose visual model is not supported."
      blocked_source: "<#E8C96D>Skipped {0} source block(s) because their visual shape touched a preserved block."
      stale: "<#E8C96D>Skipped {0} position(s) changed while models were being analyzed."
      out_of_bounds: "<#CE5F4E>A visual model extends outside the selection at <white>{0}<#CE5F4E>. Expand the selection and retry; nothing was changed."
      too_many_leaves: "<#CE5F4E>The visual result needs {0} Sculpt leaves, above the configured limit of {1}; nothing was changed."
      limit_reached: "<#CE5F4E>The operation needs {0} additional SculptBlock slot(s), but the server limit has been reached; nothing was changed."
      preflight_failed: "<#CE5F4E>Could not analyze the selected visual models; nothing was changed. See the server log."
      failed: "<#CE5F4E>{0} block position(s) failed; see the server log."

    relight:
      player_only: "<#CE5F4E>/sculpt relight must be run by a player."
      usage: "<#C2C7D3>Usage: <#D1968C>/sculpt relight"
      no_selection: "<#CE5F4E>Select a complete region first with the selection wand."
      no_blocks: "<#C2C7D3>The selection contains no active SculptBlocks."
      already_running: "<#E8C96D>You already have a TextDisplay lighting reset in progress."
      started: "<#E8C96D>Restoring automatic TextDisplay lighting for {0} active SculptBlock(s)..."
      completed: "<#5FBA6B>Lighting reset complete: checked <white>{0}<#5FBA6B> SculptBlock(s) and <white>{1}<#5FBA6B> TextDisplay(s); cleared <white>{2}<#5FBA6B> brightness override(s)."
      failed: "<#CE5F4E>{0} SculptBlock(s) failed; see the server log."

    page:
      previous_hover: "<#5FBA6B>Previous page</#5FBA6B>"
      next_hover: "<#5FBA6B>Next page</#5FBA6B>"
      info: "<#7A8B9C>Page <white>{0}<#7A8B9C>/<white>{1}"

    list:
      player_only: "<#CE5F4E>/sculpt admin list must be run by a player."
      empty: "<#C2C7D3>No active SculptBlocks in this world."
      header: "<#478FC6>Active SculptBlocks <dark_gray>({0})<#C2C7D3>: <#7A8B9C>click to TP"
      entry: "<click:run_command:/sculpt admin teleport {0}><#C2C7D3>  {0}</click> <dark_gray>{1} <#C2C7D3>[{2} leaves]"
      invalid_page: "<#CE5F4E>Page must be an integer."
      read_failed: "<#CE5F4E>Could not read the active SculptBlock list; see the server log."

    status:
      loading: "<#E8C96D>Health: LOADING (configured gridN={0})."
      ready: "<#5FBA6B>Health: READY. gridN={0}, indexed blocks={1}, all grids={2}, runtime bake={3}."
      degraded: "<#E8C96D>Health: DEGRADED. No heads for gridN={0} and runtime baking is disabled; HEAD uses placeholders while TEXTDISPLAY and AUTO fallback remain available."
      failed: "<#CE5F4E>Health: FAILED. {0}"

    tp:
      player_only: "<#CE5F4E>/sculpt admin teleport must be run by a player."
      usage: "<#CE5F4E>Usage: <#D1968C>/sculpt admin teleport <world,x,y,z>"
      invalid_format: "<#CE5F4E>Invalid location format: <white>{0}<#CE5F4E>. Expected: <white>world,x,y,z"
      world_not_found: "<#CE5F4E>World not found: <white>{0}"
      teleported: "<#5FBA6B>Teleported to <white>{0}"
      failed: "<#CE5F4E>Teleport failed: <white>{0}"


  sculpt_edit:
    non_bakeable_block: "<#CE5F4E>This block cannot be sculpted into smaller cells."
    display_incompatible: "<#CE5F4E>Your selected display cannot render <white>{0}<#CE5F4E>; choose a compatible display first."
    player_head_grid_required: "<#CE5F4E>Player-head cells require a resolution above 1x1x1."
    player_head_without_texture: "<#CE5F4E>This player head has no texture to place."
    limit_reached: "<#CE5F4E>The active SculptBlock limit has been reached."
    protected_region: "<#CE5F4E>You cannot edit blocks in this protected area."

  grid_cycle:
    no_others: "<#C2C7D3>Grid size: <white>{0}<#C2C7D3> (no other sizes available)"
    cycled: "<#C2C7D3>Grid size cycled: <white>{0} <#C2C7D3>→ <white>{1}"

  sculptheads:
    usage: "<#C2C7D3>Usage: <#D1968C>/sculpt heads [search <search> [grid]]"
    search:
      usage: "<#CE5F4E>Usage: <#D1968C>/sculpt heads search <search> [grid]"
      invalid_grid: "<#CE5F4E>Invalid grid: <white>{0}<#CE5F4E>. Must be 2, 4, 8, or 16."

wand_tool:
  name: "<#E8C96D>Selection <white>Wand</#E8C96D>"

