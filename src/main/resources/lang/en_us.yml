# English (US) translations for Sculpt
# Messages use MiniMessage format — see https://docs.advntr.dev/minimessage/format.html
languageVersion: 5

general:
  prefix: "<#478FC6>[Sculpt]</#478FC6>"
  no_permission: "<#CE5F4E>You don't have permission to use this command."
  required_perm: "<#C2C7D3>Required: <white>{0}"
  player_only: "<#CE5F4E>This command must be run by a player."
  reload_success: "<#5FBA6B>Config reloaded (defaultGridSize=<white>{0}<#5FBA6B>)."
  reload_failed: "<#CE5F4E>Config error: <white>{0}"

command:
  sculpt:
    usage: "<#C2C7D3>/sculpt [help|edit|undo|redo|blueprint|admin]"
    moved_to_editor: "<#E8C96D>/sculpt {0} moved into the editor. Run <white>/sculpt</white> or <white>/sculpt edit</white>."
    edit:
      usage: "<#C2C7D3>Usage: <#D1968C>/sculpt edit [on|off]"
    help:
      header: "<#478FC6><bold>Sculpt</bold> <dark_gray>— run <white>/sculpt</white> for the menu"
      edit: "<click:run_command:/sculpt edit><#C2C7D3>  /sculpt <white>edit <dark_gray>— enter or leave the editor</click>"
      undo: "<click:run_command:/sculpt undo><#C2C7D3>  /sculpt <white>undo</white> [steps] <dark_gray>— undo your recent edits</click>"
      redo: "<click:run_command:/sculpt redo><#C2C7D3>  /sculpt <white>redo</white> [steps] <dark_gray>— redo undone edits</click>"
      blueprint: "<click:suggest_command:/sculpt blueprint ><#C2C7D3>  /sculpt <white>blueprint <dark_gray>— manage, share, and download blueprints</click>"
      admin: "<click:suggest_command:/sculpt admin ><#C2C7D3>  /sculpt <white>admin <dark_gray>— list, teleport, reload, status</click>"
      admin_usage: "<#C2C7D3>/sculpt admin <list|teleport|reload|status>"
      hint: "<#7A8B9C>In the editor, scroll to choose a tool and press <white>Shift+right-click</white> for its settings."
    unknown_subcommand: "<#CE5F4E>Unknown subcommand: <white>{0}"

    replace:
      player_only: "<#CE5F4E>/sculpt replace must be run by a player."
      usage: "<#C2C7D3>Usage: <#D1968C>/sculpt replace <block-data>"
      no_selection: "<#CE5F4E>Select a complete region first with the selection wand."
      invalid_material: "<#CE5F4E>Invalid block material or block data: <white>{0}"
      non_bakeable: "<#CE5F4E>The replacement material cannot be baked: <white>{0}"
      too_large: "<#CE5F4E>The selected volume ({0}) exceeds the replacement limit ({1})."
      not_ready: "<#E8C96D>Sculpt textures are still loading; try again shortly."
      already_running: "<#E8C96D>You already have a region material replacement in progress."
      started: "<#E8C96D>Analyzing up to {1} selected blocks and replacing them with <white>{0}<#E8C96D>..."
      completed: "<#5FBA6B>Material replacement complete: <white>{0}<#5FBA6B> vanilla blocks, <white>{1}<#5FBA6B> existing SculptBlocks, and <white>{2}<#5FBA6B> visual shapes converted to SculptBlocks."
      no_changes: "<#C2C7D3>No non-air blocks in the selection needed replacement."
      protected: "<#CE5F4E>Skipped {0} block(s) in protected areas."
      no_collision: "<#E8C96D>Skipped {0} source block(s) without collision."
      unsupported_source: "<#E8C96D>Skipped {0} source block(s) whose visual model is not supported."
      blocked_source: "<#E8C96D>Skipped {0} source block(s) because their visual shape touched a preserved block."
      stale: "<#E8C96D>Skipped {0} position(s) changed while models were being analyzed."
      out_of_bounds: "<#CE5F4E>A visual model extends outside the selection at <white>{0}<#CE5F4E>. Expand the selection and retry; nothing was changed."
      too_many_leaves: "<#CE5F4E>The visual result needs {0} Sculpt leaves, above the configured limit of {1}; nothing was changed."
      limit_reached: "<#CE5F4E>The operation needs {0} additional SculptBlock slot(s), but the server limit has been reached; nothing was changed."
      preflight_failed: "<#CE5F4E>Could not analyze the selected visual models; nothing was changed. See the server log."
      failed: "<#CE5F4E>{0} block position(s) failed; see the server log."

    relight:
      player_only: "<#CE5F4E>/sculpt relight must be run by a player."
      usage: "<#C2C7D3>Usage: <#D1968C>/sculpt relight"
      no_selection: "<#CE5F4E>Select a complete region first with the selection wand."
      no_blocks: "<#C2C7D3>The selection contains no active SculptBlocks."
      already_running: "<#E8C96D>You already have a TextDisplay lighting reset in progress."
      started: "<#E8C96D>Restoring automatic TextDisplay lighting for {0} active SculptBlock(s)..."
      completed: "<#5FBA6B>Lighting reset complete: checked <white>{0}<#5FBA6B> SculptBlock(s) and <white>{1}<#5FBA6B> TextDisplay(s); cleared <white>{2}<#5FBA6B> brightness override(s)."
      failed: "<#CE5F4E>{0} SculptBlock(s) failed; see the server log."

    page:
      previous_hover: "<#5FBA6B>Previous page</#5FBA6B>"
      next_hover: "<#5FBA6B>Next page</#5FBA6B>"
      info: "<#7A8B9C>Page <white>{0}<#7A8B9C>/<white>{1}"

    list:
      player_only: "<#CE5F4E>/sculpt admin list must be run by a player."
      empty: "<#C2C7D3>No active SculptBlocks in this world."
      header: "<#478FC6>Active SculptBlocks <dark_gray>({0})<#C2C7D3>: <#7A8B9C>click to TP"
      entry: "<click:run_command:/sculpt admin teleport {0}><#C2C7D3>  {0}</click> <dark_gray>{1} <#C2C7D3>[{2} leaves]"
      invalid_page: "<#CE5F4E>Page must be an integer."
      read_failed: "<#CE5F4E>Could not read the active SculptBlock list; see the server log."

    status:
      loading: "<#E8C96D>Health: LOADING (configured gridN={0})."
      ready: "<#5FBA6B>Health: READY. gridN={0}, indexed blocks={1}, all grids={2}, runtime bake={3}."
      degraded: "<#E8C96D>Health: DEGRADED. No heads for gridN={0} and runtime baking is disabled; HEAD uses placeholders while TEXTDISPLAY and AUTO fallback remain available."
      failed: "<#CE5F4E>Health: FAILED. {0}"

    tp:
      player_only: "<#CE5F4E>/sculpt admin teleport must be run by a player."
      usage: "<#CE5F4E>Usage: <#D1968C>/sculpt admin teleport <world,x,y,z>"
      invalid_format: "<#CE5F4E>Invalid location format: <white>{0}<#CE5F4E>. Expected: <white>world,x,y,z"
      world_not_found: "<#CE5F4E>World not found: <white>{0}"
      teleported: "<#5FBA6B>Teleported to <white>{0}"
      failed: "<#CE5F4E>Teleport failed: <white>{0}"


command.sculpt.convert:
  usage: "<#C2C7D3>Usage: <#D1968C>/sculpt convert <barrier|shulker|null> [region|single]"
  player_only: "<#CE5F4E>/sculpt convert must be run by a player."
  changing: "<#E8C96D>Changing {0} SculptBlock(s) to <white>{1}<#E8C96D> fill..."
  changed: "<#5FBA6B>Changed {0} SculptBlock(s) to <white>{1}<#5FBA6B> fill."
  convert_failed: "<#CE5F4E>Conversion failed: {0}"
  failed: "<#CE5F4E>{0} SculptBlock conversion(s) failed; see the server log."
  protected: "<#CE5F4E>Skipped {0} SculptBlock(s) in protected areas."
  no_selection: "<#CE5F4E>Select a region first with the selection wand."
  no_target: "<#CE5F4E>No SculptBlock found at target position."
  already: "<#C2C7D3>Target SculptBlock already uses <white>{0}<#C2C7D3> fill."
  not_initialized: "<#CE5F4E>Fill converter not initialized."

# Wand tool selection messages (used by WandListener)
command.sculpt.blueprint:
  player_only: "<#CE5F4E>This command must be run by a player."
  admin_only: "<#CE5F4E>This command is admin-only."
  disabled: "<#CE5F4E>The blueprint system is disabled by configuration."
  invalid_argument: "<#CE5F4E>Invalid value for {0}."
  usage_header: "<#7A8B9C>=== <white>Blueprint Commands <#7A8B9C>==="
  usage_save: "<#7A8B9C>/sculpt blueprint save <name> [--public]"
  usage_list: "<#7A8B9C>/sculpt blueprint list [--public] [--page <n>]"
  usage_delete: "<#7A8B9C>/sculpt blueprint delete <name>"
  usage_bind: "<#7A8B9C>/sculpt blueprint bind/unbind <name> [--rotate <mode>]"
  usage_download: "<#7A8B9C>/sculpt blueprint download <url>"
  usage_publish: "<#7A8B9C>/sculpt blueprint publish <name> [--visibility <mode>] [--description <text>]"
  usage_unpublish: "<#7A8B9C>/sculpt blueprint unpublish <name|UUID>"
  usage_export: "<#7A8B9C>/sculpt blueprint export <name>"
  usage_import: "<#7A8B9C>/sculpt blueprint import <filename>"
  folia_cross_region: "<#CE5F4E>The blueprint area is not fully owned by your current Folia region. Move closer or use a smaller area."

  save:
    usage: "<#7A8B9C>/sculpt blueprint save <name> [--public]"
    success: "<#5FBA6B>Blueprint saved: <white>{0}"
    invalid_name: "<#CE5F4E>Name must contain 1-64 characters."
    no_selection: "<#CE5F4E>Select a SculptBlock first (left-click with selector tool)."
    empty_selection: "<#CE5F4E>The selected region currently contains no non-air blocks."
    limit_reached: "<#CE5F4E>Blueprint limit reached. Delete some blueprints first."
    write_error: "<#CE5F4E>Failed to write blueprint file."
    no_public_perm: "<#CE5F4E>You don't have permission to publish public blueprints."

  select:
    success: "<#5FBA6B>Blueprint source selected at <white>{0}, {1}, {2}<#5FBA6B>."
    not_sculpt: "<#CE5F4E>The selected block is not a SculptBlock."
    first_corner: "<#5FBA6B>First corner set at <white>{0}, {1}, {2}<#5FBA6B>. Right-click to set the second corner."
    cuboid_success: "<#5FBA6B>Cuboid selected at second corner <white>{0}, {1}, {2}<#5FBA6B>. Press Q for single/paste mode, then right-click to paste."
    first_corner_required: "<#CE5F4E>Left-click to set the cuboid's first corner first."
    different_world: "<#CE5F4E>Both cuboid corners must be in the same world."
    too_large: "<#CE5F4E>The selected region exceeds the server's volume limit."
    mode_cuboid: "<#D1968C>Blueprint selection mode: <white>Cuboid<#D1968C> (left first corner, right second corner)"
    mode_single: "<#D1968C>Blueprint selection mode: <white>Single / paste"
    cleared: "<#C2C7D3>Blueprint selection cancelled."

  paste:
    success: "<#5FBA6B>Blueprint pasted: <white>{0}"
    not_found: "<#CE5F4E>Blueprint not found: {0}"
    invalid_world: "<#CE5F4E>The paste target is not in a valid world."
    invalid_settings: "<#CE5F4E>Invalid rotation or flip settings."
    invalid_data: "<#CE5F4E>The blueprint failed structural validation."
    deserialize_error: "<#CE5F4E>The blueprint octree is malformed."
    protected_region: "<#CE5F4E>You cannot paste a blueprint in this protected area."
    block_in_way: "<#CE5F4E>A solid block is in the way. Enable overwrite to replace it."
    limit_reached: "<#CE5F4E>The active SculptBlock limit has been reached."
    create_failed: "<#CE5F4E>Could not create the SculptBlock."
    unsupported_display: "<#CE5F4E>The selected display cannot render one or more SculptBlock materials in this blueprint."

  list:
    header_private: "<#7A8B9C>=== <white>Private Blueprints <#7A8B9C>({0} total) ==="
    header_public: "<#7A8B9C>=== <white>Public Blueprints <#7A8B9C>({0} total) ==="
    empty_private: "<#7A8B9C>No saved blueprints."
    empty_public: "<#7A8B9C>No public blueprints yet."
    entry: "<gold>{0}. <white>{1} <#7A8B9C>grid={2} <dark_gray>{3}"
    read_error: "<#CE5F4E>Failed to read blueprint list: {0}"
    folder_header: "<#7A8B9C>=== Folders ==="
    folder_entry: "<click:run_command:/sculpt blueprint list {1}><#E8C96D>  📁 {1}</click>"

  delete:
    usage: "<#7A8B9C>/sculpt blueprint delete <name>"
    success: "<#5FBA6B>Blueprint deleted: <white>{0}"
    not_found: "<#CE5F4E>Blueprint not found: {0}"
    failed: "<#CE5F4E>Failed to delete: {0}"

  rename:
    usage: "<#7A8B9C>/sculpt blueprint rename <name> <newName>"
    success: "<#5FBA6B>Blueprint renamed to: <white>{0}"
    not_found: "<#CE5F4E>Blueprint not found: {0}"
    invalid_name: "<#CE5F4E>Name must be 1-64 characters."
    failed: "<#CE5F4E>Failed to rename blueprint."

  download:
    usage: "<#7A8B9C>/sculpt blueprint download <url>"
