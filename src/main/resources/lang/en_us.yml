    not_found: "<#CE5F4E>Blueprint not found: {0}"
    empty_hand: "<#CE5F4E>Your main hand must not be empty."
    cannot_modify: "<#CE5F4E>Cannot modify that item."
    item_name: "<#478FC6>Blueprint: <white>{0}"
    item_lore:
      - "<#7A8B9C>Grid: <white>{0}<#7A8B9C> | <white>{1}"
      - "<#C2C7D3>Right-click to paste</#C2C7D3>"

  unbind:
    success: "<#5FBA6B>Blueprint unbound."
    not_bound: "<#7A8B9C>This item has no blueprint binding."

  give:
    usage: "<#7A8B9C>/sculpt blueprint give <name> [player]"
    success: "<#5FBA6B>Received blueprint item: <white>{0}"
    not_found: "<#CE5F4E>Blueprint not found: {0}"

  settings:
    usage: "<#7A8B9C>Usage: /sculpt blueprint settings [--pasteAir|--no-pasteAir] [--overwrite|--no-overwrite] [--adhesive|--no-adhesive] [--rotate <mode>] [--ry <deg>]"
    header: "<#7A8B9C>=== Your Paste Settings ==="
    pasteAir: "<#7A8B9C>  Paste Air: <white>{0}"
    overwriteCells: "<#7A8B9C>  Overwrite Cells: <white>{0}"
    overwriteBlocks: "<#7A8B9C>  Overwrite Blocks: <white>{0}"
    adhesive: "<#7A8B9C>  Adhesive (Fusion): <white>{0}"
    rotateMode: "<#7A8B9C>  Rotate Mode: <white>{0}"
    ry: "<#7A8B9C>  Y Rotation: <white>{0}"
    saved: "<#5FBA6B>Settings saved."

  publish:
    usage: "<#7A8B9C>/sculpt blueprint publish <name> [--visibility public|unlist|secret] [--description <text>]"
    started: "<#7A8B9C>Publishing blueprint..."
    not_found: "<#CE5F4E>Blueprint not found: {0}"
    no_perm: "<#CE5F4E>You don't have permission to publish blueprints."
    no_endpoint: "<#CE5F4E>No SculptWeb API endpoint configured in config.yml (blueprint.web.apiEndpoint)."
    invalid_data: "<#CE5F4E>Blueprint data is incomplete and cannot be published."
    http_error: "<#CE5F4E>Server returned an error. Please try again later."
    rate_limited: "<#CE5F4E>Rate limited. Please wait before publishing again."
    invalid_response: "<#CE5F4E>Server returned an invalid response."
    network_error: "<#CE5F4E>Network error. Please check your connection."
    key_store_unavailable: "<#CE5F4E>The server cannot prepare secure management-key storage, so the blueprint was not uploaded. Contact an administrator."
    key_store_error: "<#CE5F4E>The blueprint was uploaded, but its management key could not be saved. Contact an administrator before publishing it again."
    success: "<#5FBA6B>Blueprint published to SculptWeb!"
    share_url: "<#7A8B9C>  Share URL: <click:open_url:{0}><hover:show_text:\"<#5FBA6B>Click to open</#5FBA6B>\"><#6BB8DB><underlined>{0}</underlined></hover></click>"
    visibility: "<#7A8B9C>  Visibility: <white>{0}"
    key_saved: "<#7A8B9C>  The management key was saved securely by this server."
    unpublish_hint: "<#7A8B9C>  Remove later: <click:suggest_command:/sculpt blueprint unpublish {0}><hover:show_text:\"<#5FBA6B>Click to fill the command</#5FBA6B>\"><#D1968C>/sculpt blueprint unpublish {0}</hover></click>"
    access_password: "<#E8C96D>  Access Password: <click:copy_to_clipboard:{0}><hover:show_text:\"<#5FBA6B>Click to copy</#5FBA6B>\"><white>{0}</hover></click><#E8C96D> (click to copy, for SECRET mode)"

  unpublish:
    usage: "<#7A8B9C>/sculpt blueprint unpublish <name|UUID>"
    started: "<#7A8B9C>Deleting the SculptWeb copy..."
    success: "<#5FBA6B>Blueprint removed from SculptWeb: <white>{0}"
    already_absent: "<#5FBA6B>The SculptWeb copy was already absent; its stored key was removed: <white>{0}"
    not_found: "<#CE5F4E>No stored SculptWeb management key was found for: {0}"
    no_endpoint: "<#CE5F4E>The saved publication has no valid SculptWeb endpoint. Check blueprint.web.apiEndpoint."
    invalid_key: "<#CE5F4E>SculptWeb rejected the stored management key. The key was retained for administrator review."
    rate_limited: "<#CE5F4E>SculptWeb is rate limiting this request. Please try again later."
    http_error: "<#CE5F4E>SculptWeb could not delete this blueprint. Please try again later."
    network_error: "<#CE5F4E>Could not reach SculptWeb. Please try again later."
    local_store_error: "<#CE5F4E>The server could not read or update the stored management key."

  export:
    usage: "<#7A8B9C>/sculpt blueprint export <name>"
    success: "<#5FBA6B>Blueprint exported: <white>{0}"
    not_found: "<#CE5F4E>Blueprint not found: {0}"
    failed: "<#CE5F4E>Failed to export blueprint."

  import:
    usage: "<#7A8B9C>/sculpt blueprint import <filename>"
    success: "<#5FBA6B>Blueprint imported: <white>{0}"
    not_found: "<#CE5F4E>File not found in export directory: {0}"
    invalid_data: "<#CE5F4E>Invalid blueprint data in file."
    failed: "<#CE5F4E>Failed to import blueprint."
    no_files: "<#7A8B9C>No exported blueprint files found."
    available: "<#7A8B9C>Available files in export directory:"

