    too_large: "<#CE5F4E>Blueprint too large to download."
    invalid_data: "<#CE5F4E>Downloaded blueprint data is invalid."
    failed: "<#CE5F4E>Download failed."

  bind:
    usage: "<#7A8B9C>/sculpt blueprint bind <name> [--pasteAir|--no-pasteAir] [--overwrite] [--adhesive] [--rotate <mode>] [--ry <deg>] [--flip <axis>]"
