      stale: "<#E8C96D>模型分析期間有 {0} 個位置被變更，已略過。"
      out_of_bounds: "<#CE5F4E>視覺模型在 <white>{0}<#CE5F4E> 超出選取範圍。請擴大選區後重試；本次未修改任何方塊。"
      too_many_leaves: "<#CE5F4E>視覺結果需要 {0} 個 Sculpt leaf，超過設定上限 {1}；本次未修改任何方塊。"
      limit_reached: "<#CE5F4E>本次操作需要額外 {0} 個 SculptBlock 名額，但伺服器上限已滿；本次未修改任何方塊。"
