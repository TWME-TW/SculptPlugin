      header: "<#478FC6>作用中的 SculptBlock <dark_gray>（{0}）<#C2C7D3>：<#7A8B9C>點擊傳送"
      entry: "<click:run_command:/sculpt admin teleport {0}><#C2C7D3>  {0}</click> <dark_gray>{1} <#C2C7D3>[{2} leaves]"
      invalid_page: "<#CE5F4E>頁碼必須是整數。"
      read_failed: "<#CE5F4E>無法讀取作用中的 SculptBlock 清單；請查看伺服器記錄。"

    status:
      loading: "<#E8C96D>健康狀態：載入中（設定 gridN={0}）。"
      ready: "<#5FBA6B>健康狀態：正常。gridN={0}、可用方塊={1}、全部網格索引={2}、執行期烘焙={3}。"
      degraded: "<#E8C96D>健康狀態：降級。gridN={0} 沒有 head 資料且執行期烘焙已停用；head 顯示會使用 placeholder，TextDisplay 與自動顯示的像素替代仍可使用。"
      failed: "<#CE5F4E>健康狀態：失敗。{0}"

    tp:
      player_only: "<#CE5F4E>/sculpt admin teleport 必須由玩家執行。"
      usage: "<#CE5F4E>用法：<#D1968C>/sculpt admin teleport <世界,x,y,z>"
