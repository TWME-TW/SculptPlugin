      completed: "<#5FBA6B>光照還原完成：已檢查 <white>{0}<#5FBA6B> 個 SculptBlock、<white>{1}<#5FBA6B> 個 TextDisplay，並清除 <white>{2}<#5FBA6B> 個亮度覆寫。"
      failed: "<#CE5F4E>{0} 個 SculptBlock 處理失敗；請查看伺服器記錄。"

    page:
      previous_hover: "<#5FBA6B>上一頁</#5FBA6B>"
      next_hover: "<#5FBA6B>下一頁</#5FBA6B>"
      info: "<#7A8B9C>第 <white>{0}<#7A8B9C>/<white>{1} <#7A8B9C>頁"

    list:
