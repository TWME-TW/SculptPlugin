      convert_failed: "<#CE5F4E>轉換失敗：{0}"
      failed: "<#CE5F4E>{0} 個 SculptBlock 轉換失敗；請查看伺服器記錄。"
      protected: "<#CE5F4E>已略過受保護區域中的 {0} 個 SculptBlock。"
      no_selection: "<#CE5F4E>請先使用選取棒選擇一個區域。"
      no_target: "<#CE5F4E>目標位置沒有 SculptBlock。"
      already: "<#C2C7D3>目標 SculptBlock 已經使用 <white>{0}<#C2C7D3> 填充。"
      not_initialized: "<#CE5F4E>填充轉換器尚未初始化。"


