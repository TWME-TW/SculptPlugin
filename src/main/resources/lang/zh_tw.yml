      world_not_found: "<#CE5F4E>找不到世界：<white>{0}"
      teleported: "<#5FBA6B>已傳送至 <white>{0}"
      failed: "<#CE5F4E>無法傳送至 <white>{0}"

    convert:
      usage: "<#C2C7D3>用法：<#D1968C>/sculpt convert <barrier|shulker|null> [region|single]"
      player_only: "<#CE5F4E>/sculpt convert 必須由玩家執行。"
      changing: "<#E8C96D>正在將 {0} 個 SculptBlock 的填充方式設為 <white>{1}<#E8C96D>..."
