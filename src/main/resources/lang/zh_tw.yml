  required_perm: "<#C2C7D3>需求權限：<white>{0}"
  player_only: "<#CE5F4E>此指令必須由玩家執行。"
  reload_success: "<#5FBA6B>設定檔已重新載入（defaultGridSize=<white>{0}<#5FBA6B>）。"
  reload_failed: "<#CE5F4E>設定檔錯誤：<white>{0}"

command:
