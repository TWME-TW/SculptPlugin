name: Sculpt
version: '${version}'

main: dev.twme.sculpt.Sculpt
api-version: '1.21.11'
load: POSTWORLD
folia-supported: true
softdepend: [ WorldEdit, FastAsyncWorldEdit, packetevents ]
libraries:
  - org.xerial:sqlite-jdbc:${sqlite.version}

authors: [ TWME-TW ]

commands:
  sculpt:
    description: Open the Sculpt editor menu
    usage: /<command> [help|edit|undo|redo|blueprint|admin]

permissions:
  sculpt.command.*:
    description: Allow every /sculpt command and editor option
    default: op
    children:
      sculpt.command.edit: true
      sculpt.command.undo: true
      sculpt.command.resolution.*: true
      sculpt.command.fill.*: true
      sculpt.command.display.*: true
      sculpt.command.convert: true
      sculpt.command.replace: true
      sculpt.command.relight: true
      sculpt.command.blueprint.*: true
      sculpt.command.heads: true
      sculpt.command.admin.*: true
      sculpt.editor.*: true

  sculpt.command.edit:
    description: Allow entering the Sculpt editor
    default: true
  sculpt.command.undo:
    description: Allow undoing and redoing your own Sculpt edits
    default: true

  sculpt.command.resolution.1:
    description: Allow editing at resolution 1
    default: op
  sculpt.command.resolution.2:
    description: Allow editing at resolution 2
    default: op
  sculpt.command.resolution.4:
    description: Allow editing at resolution 4
    default: op
  sculpt.command.resolution.8:
    description: Allow editing at resolution 8
    default: op
  sculpt.command.resolution.16:
    description: Allow editing at resolution 16
    default: op
  sculpt.command.resolution.*:
    description: Allow every resolution
    default: op
    children:
      sculpt.command.resolution.1: true
      sculpt.command.resolution.2: true
      sculpt.command.resolution.4: true
      sculpt.command.resolution.8: true
      sculpt.command.resolution.16: true

  sculpt.command.fill.barrier:
    description: Allow the barrier fill strategy
    default: true
  sculpt.command.fill.shulker:
    description: Allow the shulker fill strategy
    default: true
  sculpt.command.fill.null:
    description: Allow SculptBlocks without collision
    default: op
  sculpt.command.fill.*:
    description: Allow every fill strategy
    default: op
    children:
      sculpt.command.fill.barrier: true
      sculpt.command.fill.shulker: true
      sculpt.command.fill.null: true

  sculpt.command.display.head:
    description: Allow head rendering
    default: true
  sculpt.command.display.textdisplay:
    description: Allow TextDisplay rendering
    default: op
  sculpt.command.display.auto:
    description: Allow automatic rendering
    default: op
  sculpt.command.display.*:
    description: Allow every display backend
    default: op
    children:
      sculpt.command.display.head: true
      sculpt.command.display.textdisplay: true
      sculpt.command.display.auto: true

  sculpt.command.convert:
    description: Allow converting the fill strategy of a selection
    default: op
  sculpt.command.replace:
    description: Allow replacing block materials of a selection while keeping partial shapes
    default: op
  sculpt.command.relight:
    description: Allow restoring automatic TextDisplay lighting in a selection
    default: op

  sculpt.command.blueprint.save:
    description: Allow using /sculpt blueprint save
    default: op
  sculpt.command.blueprint.list:
    description: Allow using /sculpt blueprint list
    default: op
  sculpt.command.blueprint.delete:
    description: Allow using /sculpt blueprint delete
    default: op
  sculpt.command.blueprint.rename:
    description: Allow using /sculpt blueprint rename
    default: op
  sculpt.command.blueprint.download:
    description: Allow using /sculpt blueprint download
    default: op
  sculpt.command.blueprint.bind:
    description: Allow using /sculpt blueprint bind
    default: op
  sculpt.command.blueprint.unbind:
    description: Allow using /sculpt blueprint unbind
    default: op
  sculpt.command.blueprint.give:
    description: Allow using /sculpt blueprint give
    default: op
  sculpt.command.blueprint.settings:
    description: Allow using /sculpt blueprint settings
    default: op
  sculpt.command.blueprint.publish:
    description: Allow publishing blueprints
    default: op
  sculpt.command.blueprint.unpublish:
    description: Allow deleting owned blueprints from SculptWeb
    default: op
  sculpt.command.blueprint.export:
    description: Allow exporting blueprints to local files
    default: op
  sculpt.command.blueprint.import:
    description: Allow importing blueprints from local files
    default: op
  sculpt.command.blueprint.*:
    description: Allow every /sculpt blueprint operation
    default: op
    children:
      sculpt.command.blueprint.save: true
      sculpt.command.blueprint.list: true
      sculpt.command.blueprint.delete: true
      sculpt.command.blueprint.rename: true
      sculpt.command.blueprint.download: true
      sculpt.command.blueprint.bind: true
      sculpt.command.blueprint.unbind: true
      sculpt.command.blueprint.give: true
      sculpt.command.blueprint.settings: true
      sculpt.command.blueprint.publish: true
      sculpt.command.blueprint.unpublish: true
      sculpt.command.blueprint.export: true
      sculpt.command.blueprint.import: true

  sculpt.command.heads:
    description: Allow browsing baked head textures
    default: op

  sculpt.command.admin.list:
    description: Allow using /sculpt admin list
    default: op
  sculpt.command.admin.teleport:
    description: Allow using /sculpt admin teleport
    default: op
  sculpt.command.admin.reload:
    description: Allow using /sculpt admin reload
    default: op
  sculpt.command.admin.status:
    description: Allow using /sculpt admin status
    default: op
  sculpt.command.admin.*:
    description: Allow every /sculpt admin operation
    default: op
    children:
      sculpt.command.admin.list: true
      sculpt.command.admin.teleport: true
      sculpt.command.admin.reload: true
      sculpt.command.admin.status: true

  sculpt.editor.sculpt:
    description: Allow the editor's single-cell sculpt tool
    default: true
  sculpt.editor.paint:
    description: Allow the editor's paint tool
    default: true
  sculpt.editor.brush:
    description: Allow the editor's brush tool
    default: op
  sculpt.editor.smooth:
    description: Allow the editor's smoothing tool
    default: op
  sculpt.editor.select:
    description: Allow the editor's selection tool and its actions
    default: op
  sculpt.editor.transform:
    description: Allow moving, copying, rotating, and mirroring selections
    default: op
  sculpt.editor.shape:
    description: Allow building planes, surfaces, curves, and solids
    default: op
  sculpt.editor.blueprint:
    description: Allow placing blueprints from the editor
    default: op
  sculpt.editor.*:
    description: Allow every editor tool
    default: op
    children:
      sculpt.editor.sculpt: true
      sculpt.editor.paint: true
      sculpt.editor.brush: true
      sculpt.editor.smooth: true
      sculpt.editor.select: true
      sculpt.editor.transform: true
      sculpt.editor.shape: true
      sculpt.editor.blueprint: true

  sculpt.bypass.region-protection:
    description: Bypass region protection checks for all Sculpt edits
    default: op
