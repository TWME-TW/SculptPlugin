# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test with Maven
        run: mvn -B verify --file pom.xml
      - name: Verify distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          plugin_jar=$(find target -maxdepth 1 -type f -name 'Sculpt-*.jar' -print -quit)
          test -n "$plugin_jar"
          entries_file=$(mktemp)
          trap 'rm -f "$entries_file"' EXIT
          jar tf "$plugin_jar" > "$entries_file"
          grep -qx 'plugin.yml' "$entries_file"
          grep -qx 'config.yml' "$entries_file"
          grep -q '^dev/twme/sculpt/shaded/' "$entries_file"
          if grep -Eq '^(META-INF/versions/[0-9]+/)?(org/mineskin|org/jsoup|com/google/gson|com/google/common|com/github/benmanes/caffeine)/' "$entries_file"; then
            echo 'Unrelocated runtime dependency found in plugin JAR' >&2
            exit 1
          fi
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: Sculpt
          path: target/Sculpt-*.jar
